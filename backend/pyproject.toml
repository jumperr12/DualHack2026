[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kotwica"
version = "0.1.0"
description = "Monitoring infrastruktury podmorskiej Bałtyku (BDUH 2026)"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0",
    "pydantic-settings>=2.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Instalowane dopiero w M3 (moduł plam). Na arm64 może wymagać GDAL z apt.
sat = ["odc-stac", "rasterio", "planetary-computer", "pystac-client", "scikit-image"]

[tool.setuptools.packages.find]
include = ["kotwica*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
