x-backend: &backend
  build: ./backend
  image: kotwica-backend
  env_file: .env
  volumes:
    - data:/data
    - ./data/static:/app/data/static:ro
  restart: always
  logging:
    options: { max-size: "10m", max-file: "3" }

services:
  ais-worker:
    <<: *backend
    command: python -m workers.ais_ingest

  # detector (M1) dojdzie tutaj: command: python -m workers.detector

  api:
    <<: *backend
    command: uvicorn kotwica.api.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]

volumes:
  data:
